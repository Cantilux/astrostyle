<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">astrostyle</title>
  <desc id="desc">A CSS framework in the ASTROPRISMA style. In development.</desc>
  <defs>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#f0eee8" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#130d1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#130d1c" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="18" fill="#130d1c"/>
  <rect width="1280" height="360" rx="18" fill="url(#halftone)"/>
  <rect x="640" width="640" height="360" fill="url(#fade)"/>

  <!-- eyebrow -->
  <text x="72" y="96" fill="#f0eee8" fill-opacity=".8" font-family="'Feature Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" letter-spacing="6">STYLE GUIDE 00 / CSS FRAMEWORK</text>

  <!-- display word -->
  <text x="66" y="212" fill="#f0eee8" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="132" letter-spacing="-4">ASTROSTYLE</text>

  <!-- section heading motif: rule + index -->
  <line x1="72" y1="252" x2="1120" y2="252" stroke="#ef476e" stroke-width="2"/>
  <text x="1208" y="262" text-anchor="end" fill="#ef476e" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30">01</text>

  <!-- tagline -->
  <text x="72" y="296" fill="#e9dcd3" font-family="'Feature Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" letter-spacing="1">Buttons, inputs, panels &amp; friends, dressed for deep space.</text>

  <!-- status pill -->
  <rect x="992" y="72" width="216" height="36" rx="18" fill="#ef476e"/>
  <text x="1100" y="96" text-anchor="middle" fill="#130d1c" font-family="'Feature Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">IN DEVELOPMENT</text>

  <!-- spectrum: four hard-edged bands -->
  <rect x="0" y="336" width="320" height="24" fill="#ffbd5c"/>
  <rect x="320" y="336" width="320" height="24" fill="#ff603e"/>
  <rect x="640" y="336" width="320" height="24" fill="#d50059"/>
  <rect x="960" y="336" width="320" height="24" fill="#54009d"/>
</svg>
