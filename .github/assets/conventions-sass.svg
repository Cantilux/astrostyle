<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1320" viewBox="0 0 1040 1320" role="img" aria-labelledby="title desc">
  <title id="title">astrostyle code conventions: Sass &amp; ITCSS layers</title>
  <desc id="desc">5 rules for Sass &amp; ITCSS layers. A complete text version is available in the README below this image.</desc>
  <defs>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#130d1c" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1040" height="1320" rx="18" fill="#f0eee8"/>
  <rect width="1040" height="1320" rx="18" fill="url(#halftone)"/>
  <g font-family="'Feature Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#130d1c">
    <text x="40" y="48" font-size="22" font-weight="700" letter-spacing="2">SASS &amp; ITCSS LAYERS</text>
    <text x="1000" y="48" text-anchor="end" font-size="13" letter-spacing="2">CONVENTIONS / 01</text>
    <line x1="40" y1="72" x2="1000" y2="72" stroke="#130d1c" stroke-width="2"/>
    <g transform="translate(0 96)" data-rule="1">
      <polygon points="40,0 366,0 346,112 40,112" fill="#54009d"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">01</text>
      <text x="60" y="70" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">MODULE SYSTEM</text>
      <text font-size="16">
        <tspan x="400" y="50.0">Dart Sass module system only: @use and @forward. No</tspan>
        <tspan x="400" y="74.0">@import, no @extend across modules.</tspan>
      </text>
    </g>
    <g transform="translate(0 224)" data-rule="2">
      <polygon points="40,0 366,0 346,112 40,112" fill="#d50059"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">02</text>
      <text x="60" y="70" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">LAYER FOLDERS</text>
      <text font-size="16">
        <tspan x="400" y="62.0">One folder per ITCSS layer:</tspan>
      </text>
    </g>
    <g transform="translate(0 352)" data-layers="itcss">
      <text x="60" y="24" font-size="13" font-weight="700" letter-spacing="2">LAYER</text>
      <text x="280" y="24" font-size="13" font-weight="700" letter-spacing="2">FOLDER</text>
      <text x="590" y="24" font-size="13" font-weight="700" letter-spacing="2">OUTPUT</text>
      <text x="910" y="24" font-size="13" font-weight="700" letter-spacing="2">PREFIX</text>
      <g transform="translate(0 48)" data-layer="Settings">
        <polygon points="40,0 260,0 244,64 40,64" fill="none" stroke="#130d1c" stroke-width="2" stroke-dasharray="6 6"/>
        <text x="60" y="38" fill="#130d1c" font-size="16" font-weight="700" letter-spacing="1">SETTINGS</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/settings/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="26">nothing: configuration and</tspan>
        <tspan x="590" y="50">token maps</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">—</tspan>
      </text>
      </g>
      <g transform="translate(0 120)" data-layer="Tools">
        <polygon points="40,0 260,0 244,64 40,64" fill="none" stroke="#130d1c" stroke-width="2" stroke-dasharray="6 6"/>
        <text x="60" y="38" fill="#130d1c" font-size="16" font-weight="700" letter-spacing="1">TOOLS</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/tools/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="38">nothing: functions and mixins</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">—</tspan>
      </text>
      </g>
      <g transform="translate(0 192)" data-layer="Generic">
        <polygon points="40,0 260,0 244,64 40,64" fill="#54009d"/>
        <text x="60" y="38" fill="#f0eee8" font-size="16" font-weight="700" letter-spacing="1">GENERIC</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/generic/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="26">custom properties, box model,</tspan>
        <tspan x="590" y="50">reset</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">—</tspan>
      </text>
      </g>
      <g transform="translate(0 264)" data-layer="Elements">
        <polygon points="40,0 260,0 244,64 40,64" fill="#d50059"/>
        <text x="60" y="38" fill="#f0eee8" font-size="16" font-weight="700" letter-spacing="1">ELEMENTS</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/elements/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="38">defaults for bare HTML elements</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">—</tspan>
      </text>
      </g>
      <g transform="translate(0 336)" data-layer="Objects">
        <polygon points="40,0 260,0 244,64 40,64" fill="#ef476e"/>
        <text x="60" y="38" fill="#130d1c" font-size="16" font-weight="700" letter-spacing="1">OBJECTS</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/objects/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="38">layout patterns, no cosmetics</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">ap-o-</tspan>
      </text>
      </g>
      <g transform="translate(0 408)" data-layer="Components">
        <polygon points="40,0 260,0 244,64 40,64" fill="#ff603e"/>
        <text x="60" y="38" fill="#130d1c" font-size="16" font-weight="700" letter-spacing="1">COMPONENTS</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/components/&lt;name&gt;/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="38">the designed UI pieces</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">ap-c-</tspan>
      </text>
      </g>
      <g transform="translate(0 480)" data-layer="Utilities">
        <polygon points="40,0 260,0 244,64 40,64" fill="#ffbd5c"/>
        <text x="60" y="38" fill="#130d1c" font-size="16" font-weight="700" letter-spacing="1">UTILITIES</text>
      <text font-size="14">
        <tspan x="280" y="38">scss/utilities/</tspan>
      </text>
      <text font-size="14">
        <tspan x="590" y="38">single-purpose overrides</tspan>
      </text>
      <text font-size="14">
        <tspan x="910" y="38">ap-u-</tspan>
      </text>
      </g>
    </g>
    <g transform="translate(0 920)" data-rule="3">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ef476e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">03</text>
      <text x="60" y="58" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">DEPENDENCY</text>
      <text x="60" y="82" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">DIRECTION</text>
      <text font-size="16">
        <tspan x="400" y="50.0">A layer only depends on the layers above it. A component</tspan>
        <tspan x="400" y="74.0">never styles another component or an object.</tspan>
      </text>
    </g>
    <g transform="translate(0 1048)" data-rule="4">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ff603e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">04</text>
      <text x="60" y="70" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">CONFIGURATION</text>
      <text font-size="16">
        <tspan x="400" y="50.0">Every configurable variable is !default; map settings are</tspan>
        <tspan x="400" y="74.0">deep-merged with the defaults.</tspan>
      </text>
    </g>
    <g transform="translate(0 1176)" data-rule="5">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ffbd5c"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">05</text>
      <text x="60" y="70" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">TOKEN VALUES</text>
      <text font-size="16">
        <tspan x="400" y="38.0">Raw values (colors, font sizes, radii, durations,</tspan>
        <tspan x="400" y="62.0">z-indexes) live only in scss/settings/. Everywhere else:</tspan>
        <tspan x="400" y="86.0">token(), space(), text() and friends.</tspan>
      </text>
    </g>
  </g>
</svg>
