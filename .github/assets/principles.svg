<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1264" viewBox="0 0 1040 1264" role="img" aria-labelledby="title desc">
  <title id="title">The astrostyle principles, in short</title>
  <desc id="desc">Nine principles pair the framework's design rules with their meaning. A complete text version is available in the README below this image.</desc>
  <defs>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#130d1c" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1040" height="1264" rx="18" fill="#f0eee8"/>
  <rect width="1040" height="1264" rx="18" fill="url(#halftone)"/>
  <g font-family="'Feature Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#130d1c">
    <text x="40" y="48" font-size="22" font-weight="700" letter-spacing="2">THE PRINCIPLES, IN SHORT</text>
    <text x="1000" y="48" text-anchor="end" font-size="13" letter-spacing="2">ASTROSTYLE / 09</text>
    <line x1="40" y1="72" x2="1000" y2="72" stroke="#130d1c" stroke-width="2"/>
    <g transform="translate(0 96)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#54009d"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">01</text>
      <text x="60" y="58" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">GENERIC,</text>
      <text x="60" y="82" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">NOT GAME-SPECIFIC</text>
      <text font-size="16">
        <tspan x="400" y="38">Interface building blocks only. Combat trackers, star maps</tspan>
        <tspan x="400" y="62">and character sheets live in your project, built on top of</tspan>
        <tspan x="400" y="86">astrostyle.</tspan>
      </text>
    </g>
    <g transform="translate(0 224)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#d50059"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">02</text>
      <text x="60" y="70" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">DESIGN TOKENS</text>
      <text font-size="16">
        <tspan x="400" y="38">Every color, size, space, radius, duration and layer index</tspan>
        <tspan x="400" y="62">is a token: defined once in Sass, published as CSS custom</tspan>
        <tspan x="400" y="86">properties and as a W3C Design Tokens JSON file.</tspan>
      </text>
    </g>
    <g transform="translate(0 352)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ef476e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">03</text>
      <text x="60" y="70" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">ITCSS</text>
      <text font-size="16">
        <tspan x="400" y="38">Styles flow from generic to specific (see the triangle</tspan>
        <tspan x="400" y="62">below), and the browser enforces the order through native</tspan>
        <tspan x="400" y="86">cascade layers.</tspan>
      </text>
    </g>
    <g transform="translate(0 480)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ff603e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">04</text>
      <text x="60" y="58" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">UNIVERSAL BOX</text>
      <text x="60" y="82" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">MODEL &amp; RESET</text>
      <text font-size="16">
        <tspan x="400" y="50">border-box everywhere, plus a minimal reset at zero</tspan>
        <tspan x="400" y="74">specificity.</tspan>
      </text>
    </g>
    <g transform="translate(0 608)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ffbd5c"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">05</text>
      <text x="60" y="70" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">MOBILE FIRST</text>
      <text font-size="16">
        <tspan x="400" y="38">Narrow screens are the base. Bigger layouts are added with</tspan>
        <tspan x="400" y="62">min-width only, and components react to their container,</tspan>
        <tspan x="400" y="86">not the window.</tspan>
      </text>
    </g>
    <g transform="translate(0 736)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#54009d"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">06</text>
      <text x="60" y="70" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">LOW SPECIFICITY</text>
      <text font-size="16">
        <tspan x="400" y="50">One class per selector at most. No IDs, no !important.</tspan>
        <tspan x="400" y="74">Your CSS always wins.</tspan>
      </text>
    </g>
    <g transform="translate(0 864)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#d50059"/>
      <text x="60" y="24" fill="#f0eee8" font-size="13" letter-spacing="2">07</text>
      <text x="60" y="70" fill="#f0eee8" font-size="18" font-weight="700" letter-spacing="1">COMPONENT-BASED</text>
      <text font-size="16">
        <tspan x="400" y="50">Self-contained components with no outer margins, combined</tspan>
        <tspan x="400" y="74">with layout objects.</tspan>
      </text>
    </g>
    <g transform="translate(0 992)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ef476e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">08</text>
      <text x="60" y="70" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">EASY TO CUSTOMIZE</text>
      <text font-size="16">
        <tspan x="400" y="38">Change a custom property at runtime, configure with Sass</tspan>
        <tspan x="400" y="62">@use … with (…), add variants and themes with public</tspan>
        <tspan x="400" y="86">mixins, or build new components with the same tools.</tspan>
      </text>
    </g>
    <g transform="translate(0 1120)">
      <polygon points="40,0 366,0 346,112 40,112" fill="#ff603e"/>
      <text x="60" y="24" fill="#130d1c" font-size="13" letter-spacing="2">09</text>
      <text x="60" y="58" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">NO FRAMEWORK</text>
      <text x="60" y="82" fill="#130d1c" font-size="18" font-weight="700" letter-spacing="1">LOCK-IN</text>
      <text font-size="16">
        <tspan x="400" y="38">Plain HTML and CSS first, native elements (&lt;dialog&gt;,</tspan>
        <tspan x="400" y="62">popover, &lt;details&gt;) where possible, and tiny vanilla JS</tspan>
        <tspan x="400" y="86">modules only where HTML is not enough.</tspan>
      </text>
    </g>
  </g>
</svg>
