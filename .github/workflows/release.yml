# Publishes astrostyle to npm when master carries a version that npm does not have yet, then
# tags it. Versions are bumped in a release PR with `bun run release:version` (see README).
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Use an npm CLI with trusted publishing
        run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - name: Decide whether to publish
        id: plan
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          private=$(node -p "require('./package.json').private === true")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Package is private: nothing to publish."
          elif npm view "$name@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$name@$version is already on npm."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Publishing $name@$version."
          fi
      - if: steps.plan.outputs.publish == 'true'
        run: bun run lint && bun run test && bun run build && bun run check:package
      - if: steps.plan.outputs.publish == 'true'
        run: npm publish
      - name: Tag the version
        if: steps.plan.outputs.private != 'true'
        run: |
          tag="v${{ steps.plan.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null; then
            echo "$tag already exists."
          else
            git tag "$tag" && git push origin "$tag"
          fi
